# Own VPS deployment. Put HTTPS (e.g. Caddy or nginx with Let's Encrypt) in front of port 4000
# and set TRUST_PROXY=true, NODE_ENV=production.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mela_sales
      MYSQL_USER: mela
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: mysql://mela:${MYSQL_PASSWORD}@db:3306/mela_sales
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads:/app/uploads
volumes:
  dbdata:
  uploads:
